name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@bingooo/shared

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@bingooo/api

      - name: Run Backend Tests
        run: npm test --workspace=@bingooo/api

      - name: Build Backend (NestJS)
        run: npm run build --workspace=@bingooo/api

      - name: Build Frontend (React + Vite)
        run: npm run build --workspace=@bingooo/web
