version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bingooo_postgres
    restart: always
    environment:
      POSTGRES_USER: bingooo_user
      POSTGRES_PASSWORD: bingooo_secure_password_2026
      POSTGRES_DB: bingooo_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bingooo_user -d bingooo_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
